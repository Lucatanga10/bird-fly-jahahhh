name: Build APK

on:
  push:
    branches: [ "claude/session-description-review-ul0gyx", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug - list mipmap files
        run: |
          echo "=== Git commit ==="
          git log --oneline -1
          echo "=== Manifest icon lines ==="
          grep -n "icon\|roundIcon" app/src/main/AndroidManifest.xml
          echo "=== Mipmap files ==="
          find app/src/main/res/mipmap* -type f 2>/dev/null || echo "NO MIPMAP DIRS"
          echo "=== All res dirs ==="
          ls -la app/src/main/res/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BumpBot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
